# Пример конфигурации для VPS. На текущем GitHub Pages этот файл не применяется.
server {
    listen 80;
    listen [::]:80;
    server_name ls-detailing.ru www.ls-detailing.ru api.ls-detailing.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ls-detailing.ru;

    ssl_certificate /etc/letsencrypt/live/api.ls-detailing.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ls-detailing.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
